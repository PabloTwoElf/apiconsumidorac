<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CulturalTrip · Elige tu asiento</title>
    <meta
      name="description"
      content="Selecciona y reserva asientos de bus con pago seguro a través de PayPal."
    />
    <meta name="theme-color" content="#070b18" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='78'%3E%F0%9F%9A%8C%3C/text%3E%3C/svg%3E"
    />

    <!--
      El tema se aplica antes de pintar para evitar el destello blanco que se
      produciría si React lo decidiera después de la primera pasada.
    -->
    <script>
      try {
        var saved = localStorage.getItem('culturaltrip-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
      } catch (e) {
        /* modo privado: se queda el tema oscuro del atributo */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
