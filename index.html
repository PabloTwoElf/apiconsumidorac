<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CulturalTrip · Elige tu asiento</title>
    <meta
      name="description"
      content="Selecciona y reserva asientos de bus con pago seguro a través de PayPal."
    />
    <meta name="theme-color" content="#070b18" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 6v6M15 6v6M2 12h19.6'/><path d='M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3'/><circle cx='7' cy='18' r='2'/><path d='M9 18h5'/><circle cx='16' cy='18' r='2'/></svg>"
    />

    <!--
      El tema se aplica antes de pintar para evitar el destello blanco que se
      produciría si React lo decidiera después de la primera pasada.
    -->
    <script>
      try {
        var saved = localStorage.getItem('culturaltrip-theme');
        var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = saved || (prefersLight ? 'light' : 'dark');
      } catch (e) {
        /* modo privado: se queda el tema oscuro del atributo */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
